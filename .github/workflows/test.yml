name: 打包
on: push
permissions:
  contents: write
jobs:
  RunTesting:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 打包应用
        run: |
          npm ci
          npm run build -- --base-href /github-actions-demo1/
      - name: 部署到gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/github-actions-demo1/browser
          branch: gh-pages
